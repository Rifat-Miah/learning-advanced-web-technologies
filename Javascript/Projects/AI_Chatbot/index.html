<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>
    <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chatbot-popup">
        <!-- Header -->
        <div class="chat-header">
            <div class="header-info">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 8 8">
                    <path fill="black" d="M6 6H0V1h2V0h1v1h2V0h1v1h2v7M2 4v1h4V4M2 3h1V2H2m3 1h1V2H5"/>
                </svg>
                <h2 class="logo-text">AI Chatbot</h2>
            </div>
            <button class="material-symbols-outlined">keyboard_arrow_down</button>
        </div>
        <!--Body-->
        <div class="chat-body">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 8 8">
                <path fill="black" d="M6 6H0V1h2V0h1v1h2V0h1v1h2v7M2 4v1h4V4M2 3h1V2H2m3 1h1V2H5"/>
            </svg>
            <div class="message-text">Hey there 😎<br>
            How can I help you?
            </div>
            <div class="message user-message">
                <div class="message-text">Lorem ipsum dolor sit amet consectetur adipisicing elit. Obcaecati dicta placeat cumque, repudiandae accusamus at maxime? Recusandae itaque reiciendis harum.</div>
            </div>
        </div>
        <!--Footer-->
        <div class="chat-footer">
            <form action="#" class="chat-form">
                <textarea placeholder="Type here ..." class="message-input"></textarea>
                <div class="chat-controls">
                    <button type="button"
                    class="material-symbols-outlined">sentiment_satisfied</button>
                    <button type="button"
                    class="material-symbols-outlined">attach_file</button>
                    <button type="submit"
                    class="material-symbols-outlined">arrow_upward</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
